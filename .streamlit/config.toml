[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
font = "sans serif"
baseRadius = "6px"
buttonRadius = "6px"
showSidebarBorder = true
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.light]
primaryColor = "#1f5fbf"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#14181f"
borderColor = "#e2e5ea"

[theme.dark]
primaryColor = "#5a9cf0"
backgroundColor = "#0f1319"
secondaryBackgroundColor = "#171c24"
textColor = "#e8eaee"
borderColor = "#262d38"
